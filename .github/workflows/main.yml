on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Flyway migrations
        # Cheap pre-flight: two PRs adding the same Vxx__ number is the most
        # common breakage. Fail before we waste 5 minutes building a jar that
        # Flyway will reject at startup.
        run: |
          cd lambdas/src/main/resources/db/migration
          dupes=$(ls V*.sql | sed -E 's/^V([0-9]+)__.*/\1/' | sort -n | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate Flyway migration version(s): $dupes"
            for v in $dupes; do
              echo "::error::V$v files:"
              ls -1 V${v}__*.sql | sed 's/^/  /'
            done
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
      - name: Build (assemble + test)
        run: cd lambdas && ./gradlew build
      - name: Integration test
        run: |
          docker compose up -d
          timeout 60 sh -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done'
          cd lambdas && ./gradlew integrationTest
          docker compose down
      - name: Upload backend jar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scorcerer-jar
          path: lambdas/build/libs/scorcerer.jar
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Lint frontend
        run: cd frontend && npm run lint

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for backend/infra/frontend changes
        id: changes
        run: |
          # Manual workflow_dispatch runs always deploy (used to toggle the
          # frontend Fargate service on/off via the DEPLOY_FRONTEND_DEV var
          # without touching code).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying."
            echo "deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push to this branch — deploying."
            echo "deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Backend / infra changes always force a CDK deploy. Frontend
          # changes only matter when the Fargate frontend is actually serving
          # (DEPLOY_FRONTEND_DEV=true) — otherwise Vercel handles the deploy
          # and CDK has nothing to do.
          CHANGES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          if echo "$CHANGES" | grep -qE '^(lambdas/|cdk/|contract/)'; then
            echo "Backend/infra changed — deploying."
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif echo "$CHANGES" | grep -qE '^frontend/' && [ "${{ vars.DEPLOY_FRONTEND_DEV }}" = "true" ]; then
            echo "Frontend changed and Fargate frontend is enabled — deploying."
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json
      - name: Download backend jar
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: scorcerer-jar
          path: lambdas/build/libs/
      - name: Install CDK dependencies
        if: steps.changes.outputs.deploy == 'true'
        run: cd cdk && npm ci
      - name: CDK deploy
        if: steps.changes.outputs.deploy == 'true'
        run: cd cdk && npx cdk deploy --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-2
          CDK_ENV: staging
          CDK_ACCOUNT_ID: ${{ secrets.DEV_CDK_ACCOUNT_ID }}
          CDK_DB_PASSWORD: ${{ secrets.DEV_CDK_DB_PASSWORD }}
          CDK_API_DOMAIN: api.dev.predictaball.live
          CDK_ADMIN_API_KEY: ${{ secrets.DEV_ADMIN_API_KEY }}
          CDK_NEXTAUTH_SECRET: ${{ secrets.DEV_NEXTAUTH_SECRET }}
          CDK_RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY }}
          CDK_FRONTEND_DOMAIN: dev.predictaball.live
          CDK_VERCEL_CNAME: e99e15f96fe913bd.vercel-dns-017.com
          # Optional Next.js Fargate frontend. Flip the GitHub repo variable
          # DEPLOY_FRONTEND_DEV between "true" and "false" (or unset) and
          # re-run the workflow to provision/tear down. Empty string == off.
          CDK_DEPLOY_FRONTEND: ${{ vars.DEPLOY_FRONTEND_DEV }}
          CDK_FRONTEND_FARGATE_HOST: frontend.dev.predictaball.live
          CDK_AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          CDK_AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          CDK_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      - name: Health check
        if: steps.changes.outputs.deploy == 'true'
        run: |
          sleep 30
          curl -f https://api.dev.predictaball.live/ping
