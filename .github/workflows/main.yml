on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
      - name: Build (assemble + test)
        run: cd lambdas && ./gradlew build
      - name: Integration test
        run: |
          docker compose up -d
          timeout 60 sh -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done'
          cd lambdas && ./gradlew integrationTest
          docker compose down
      - name: Upload backend jar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scorcerer-jar
          path: lambdas/build/libs/scorcerer.jar
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Lint frontend
        run: cd frontend && npm run lint

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for backend/infra changes
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push to this branch — deploying."
            echo "deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(lambdas/|cdk/|contract/)'; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json
      - name: Download backend jar
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: scorcerer-jar
          path: lambdas/build/libs/
      - name: Install CDK dependencies
        if: steps.changes.outputs.deploy == 'true'
        run: cd cdk && npm ci
      - name: CDK deploy
        if: steps.changes.outputs.deploy == 'true'
        run: cd cdk && npx cdk deploy --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-2
          CDK_ENV: staging
          CDK_ACCOUNT_ID: ${{ secrets.DEV_CDK_ACCOUNT_ID }}
          CDK_DB_PASSWORD: ${{ secrets.DEV_CDK_DB_PASSWORD }}
          CDK_API_DOMAIN: api.dev.predictaball.live
          CDK_ADMIN_API_KEY: ${{ secrets.DEV_ADMIN_API_KEY }}
          CDK_NEXTAUTH_SECRET: ${{ secrets.DEV_NEXTAUTH_SECRET }}
          CDK_RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY }}
          CDK_FOOTBALL_DATA_API_KEY: ${{ secrets.DEV_FOOTBALL_DATA_API_KEY }}
          CDK_FRONTEND_DOMAIN: dev.predictaball.live
          CDK_VERCEL_CNAME: e99e15f96fe913bd.vercel-dns-017.com
      - name: Health check
        if: steps.changes.outputs.deploy == 'true'
        run: |
          sleep 30
          curl -f https://api.dev.predictaball.live/ping
