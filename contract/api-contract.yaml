openapi: 3.0.0
info:
  version: 1.0.0
  title: ScorePredictor
  description: An API for the Score Predictor Backend
components:
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${cognitoUserPoolId}
  schemas:
    prediction:
      type: object
      required:
        - homeScore
        - awayScore
        - chip
        - matchId
        - predictionId
        - userId
      properties:
        points:
          description: The points earned by the prediction
          type: integer
          format: int32
        homeScore:
          description: The home team final number of goals
          type: integer
          format: int32
        chip:
          description: The chip that the user played
          $ref: '#/components/schemas/chip'
        awayScore:
          description: The away team final number of goals
          type: integer
          format: int32
        matchId:
          description: The matchId which is being predicted
          type: string
        predictionId:
          description: Unique predictionId
          type: string
        userId:
          description: The user who made the prediction
          type: string
    match:
      type: object
      required:
        - homeTeam
        - homeTeamFlagCode
        - awayTeam
        - awayTeamFlagCode
        - matchId
        - venue
        - datetime
        - matchDay
        - round
        - state
      properties:
        homeTeam:
          description: Home team
          type: string
        homeTeamFlagCode:
          description: Home team flag code
          type: string
        homeTeamRanking:
          description: Home team ranking
          type: integer
          format: int32
        awayTeam:
          description: Away team
          type: string
        awayTeamFlagCode:
          description: Away team flag code
          type: string
        awayTeamRanking:
          description: Away team ranking
          type: integer
          format: int32
        homeScore:
          description: The home team final number of goals
          type: integer
          format: int32
        awayScore:
          description: The away team final number of goals
          type: integer
          format: int32
        matchId:
          description: Unique matchId
          type: string
        venue:
          description: Venue of the match
          type: string
        datetime:
          description: datetime of kickoff
          type: string
          format: date-time
        matchDay:
          description: Match day of the game
          type: integer
          format: int32
        round:
          description: Round of match
          type: string
          enum:
            - GROUP_STAGE
            - ROUND_OF_SIXTEEN
            - QUARTER_FINAL
            - SEMI_FINAL
            - FINAL
        state:
          description: State of the match
          type: string
          enum:
            - LIVE
            - UPCOMING
            - COMPLETED
        prediction:
          $ref: '#/components/schemas/prediction'
        predictionDistribution:
          $ref: '#/components/schemas/predictionDistribution'

    predictionDistribution:
      description: Counts of predictions by outcome (home/draw/away). Populated once a match is no longer UPCOMING.
      type: object
      required:
        - home
        - draw
        - away
      properties:
        home:
          type: integer
          format: int32
        draw:
          type: integer
          format: int32
        away:
          type: integer
          format: int32

    league:
      type: object
      required:
        - leagueId
        - name
        - kind
        - users
      properties:
        leagueId:
          description: Unique league Id
          type: string
        name:
          description: League name
          type: string
        kind:
          description: Whether the league is auto-managed by the system or user-created.
          type: string
          enum:
            - GLOBAL
            - COUNTRY
            - USER
        users:
          description: List of users in the league
          type: array
          items:
            $ref: '#/components/schemas/user'
        yourPosition:
          description: Position of the requesting user within this league. Omitted when not relevant (e.g. unauthenticated requests).
          type: integer
          format: int32
          minimum: 1
    team:
      type: object
      required:
        - teamId
        - teamName
        - flagCode
      properties:
        teamId:
          description: Team Id
          type: string
        teamName:
          description: Team name
          type: string
        flagCode:
          description: Team flag uri
          type: string
    leaderboard:
      type: array
      items:
        type: object
        required:
          - position
          - movement
          - user
        properties:
          position:
            type: integer
            format: int32
            minimum: 1
          user:
            $ref: '#/components/schemas/user'
          movement:
            type: string
            enum:
              - IMPROVED
              - WORSENED
              - UNCHANGED
    user:
      type: object
      required:
        - firstName
        - familyName
        - userId
        - doublePointsChipsRemaining
        - oneOutChipsRemaining
        - crowdChipsRemaining
        - fixedPoints
        - livePoints
      properties:
        firstName:
          type: string
        familyName:
          type: string
        userId:
          type: string
        doublePointsChipsRemaining:
          type: integer
        oneOutChipsRemaining:
          type: integer
        crowdChipsRemaining:
          type: integer
        fixedPoints:
          type: integer
        livePoints:
          type: integer
        supportedTeamName:
          type: string
        supportedTeamFlagCode:
          type: string
    toGoThrough:
      description: For knockout games which team will go through
      type: string
      enum:
        - HOME
        - AWAY
    chip:
      description: A chip to modify the prediction
      type: string
      enum:
        - NONE
        - DOUBLE_POINTS
        - ONE_GOAL_OUT
        - CROWD
    predictionWithUser:
      type: object
      required:
        - prediction
        - user
      properties:
        prediction:
          $ref: '#/components/schemas/prediction'
        user:
          $ref: '#/components/schemas/user'
security:
  - CognitoAuthorizer: []
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: |
        {
            "message": "$context.error.validationErrorString"
        }
x-amazon-apigateway-request-validator: DefaultValidator
x-amazon-apigateway-request-validators:
  DefaultValidator:
    validateRequestParameters: true
    validateRequestBody: true
paths:
  /team:
    get:
      tags:
        - team
      operationId: getTeams
      description: List all teams
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/team'
    post:
      tags:
        - team
      operationId: createTeam
      description: Create a team
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamName:
                  type: string
                flagCode:
                  type: string
              required:
                - teamName
                - flagCode
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  teamId:
                    type: string
  /team/{teamId}:
    get:
      tags:
        - team
      operationId: getTeam
      description: Get a team by Id
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/team'
  /team/name/{teamName}:
    get:
      tags:
        - team
      operationId: getTeamByName
      description: Get a team by Name
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: teamName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/team'

  /prediction/{matchId}:
    get:
      tags:
        - prediction
      operationId: getPrediction
      description: Get a prediction for a match
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/prediction'


  /prediction:
    post:
      tags:
        - prediction
      operationId: createPrediction
      description: Create a prediction
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homeScore:
                  description: The home team final number of goals
                  type: integer
                  format: int32
                awayScore:
                  description: The away team final number of goals
                  type: integer
                  format: int32
                matchId:
                  description: The matchId which is being predicted
                  type: string
                chip:
                  description: The chip that the user played
                  $ref: '#/components/schemas/chip'
                toGoThrough:
                  $ref: '#/components/schemas/toGoThrough'
              required:
                - homeScore
                - awayScore
                - matchId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - predictionId
                  - doublePointsChipsRemaining
                  - oneOutChipsRemaining
                  - crowdChipsRemaining
                properties:
                  predictionId:
                    type: string
                  doublePointsChipsRemaining:
                    type: integer
                    format: int32
                  oneOutChipsRemaining:
                    type: integer
                    format: int32
                  crowdChipsRemaining:
                    type: integer
                    format: int32
  /match/data/{matchId}:
    get:
      tags:
        - match
      operationId: getMatch
      description: Get a match
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/match'

  /match:
    post:
      tags:
        - match
      operationId: createMatch
      description: Create a match
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homeTeamId:
                  description: Home team ID
                  type: string
                awayTeamId:
                  description: Away team ID
                  type: string
                datetime:
                  description: datetime of kickoff
                  type: string
                  format: date-time
                venue:
                  description: Venue of the match
                  type: string
                matchDay:
                  description: Match day
                  type: integer
                matchRound:
                  description: Round of match
                  type: string
                  enum:
                    - GROUP_STAGE
                    - ROUND_OF_SIXTEEN
                    - QUARTER_FINAL
                    - SEMI_FINAL
                    - FINAL
              required:
                - homeTeamId
                - awayTeamId
                - datetime
                - venue
                - matchDay
                - matchRound
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchId:
                    type: string

  /match/list:
    get:
      tags:
        - match
      operationId: listMatches
      description: List matches
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: query
          name: filterType
          schema:
            type: string
            enum: [live, upcoming, completed]
        - in: query
          name: userId
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/match'
  /match/{matchId}/predictions:
    get:
      tags:
        - match
      operationId: getMatchPredictions
      description: Get match predictions
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
        - in: query
          name: leagueId
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/predictionWithUser'
  /match/{matchId}/score:
    post:
      tags:
        - match
      operationId: setMatchScore
      description: Update match score
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homeScore:
                  description: The home team final number of goals
                  type: integer
                  format: int32
                awayScore:
                  description: The away team final number of goals
                  type: integer
                  format: int32
              required:
                - homeScore
                - awayScore
      responses:
        '200':
          description: Successful response

  /match/{matchId}/complete:
    post:
      tags:
        - match
      operationId: completeMatch
      description: Mark match as completed
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - homeScore
                - awayScore
              properties:
                homeScore:
                  description: The home team final number of goals
                  type: integer
                  format: int32
                awayScore:
                  description: The away team final number of goals
                  type: integer
                  format: int32
                toGoThrough:
                  $ref: '#/components/schemas/toGoThrough'


      responses:
        '200':
          description: Successful response

  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      description: Login
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - idToken
                  - refreshToken

        '401':
          description: Unauthorized
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      description: Refresh an expired ID token using a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                  refreshToken:
                    type: string
                  accessToken:
                    type: string
                required:
                  - idToken
                  - refreshToken
        '401':
          description: Unauthorized
  /auth/reset:
    post:
      tags:
        - auth
      operationId: resetPassword
      description: Request to reset the users password
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        '200':
          description: Successful response

  /auth/reset-confirm:
    post:
      tags:
        - auth
      operationId: resetPasswordConfirm
      description: Confirm password reset using otp
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                otp:
                  type: string
                password:
                  type: string
              required:
                - email
                - otp
                - password
      responses:
        '200':
          description: Successful response
  /auth/check-email:
    get:
      tags:
        - auth
      operationId: checkEmail
      description: Check whether an account exists for the given email
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - exists
                properties:
                  exists:
                    type: boolean
  /auth/ping:
    get:
      tags:
        - auth
      operationId: authPing
      description: Keep auth lambda warm
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      responses:
        '200':
          description: Successful response

  /user:
    post:
      tags:
        - user
      operationId: signup
      security: []
      description: Register as a new user
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                familyName:
                  type: string
                emailReminders:
                  type: boolean
                supportedTeamId:
                  type: string
              required:
                - email
                - password
                - firstName
                - familyName
                - supportedTeamId
      responses:
        '200':
          description: Successful response
  /user/supported-team:
    post:
      tags:
        - user
      operationId: setSupportedTeam
      description: Set the signed-in user's supported team and join its country league (set-once)
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
              required:
                - teamId
      responses:
        '200':
          description: Successful response
  /user/{userId}/predictions:
    get:
      tags:
        - user
      operationId: getUserPredictions
      description: Get users predictions
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          required: true
          name: userId
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/prediction'
  /user/{userId}/points:
    get:
      tags:
        - user
      operationId: getUserPoints
      description: Get users points
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          required: true
          name: userId
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixedPoints:
                    type: integer
                    format: int32
                  livePoints:
                    type: integer
                    format: int32
  /user/{userId}/chips:
    get:
      tags:
        - user
      operationId: getUserChips
