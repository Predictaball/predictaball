openapi: 3.0.0
info:
  version: 1.0.0
  title: ScorePredictor
  description: An API for the Score Predictor Backend
components:
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${cognitoUserPoolId}
  schemas:
    prediction:
      type: object
      required:
        - homeScore
        - awayScore
        - chip
        - matchId
        - predictionId
        - userId
      properties:
        points:
          description: The points earned by the prediction
          type: integer
          format: int32
        homeScore:
          description: The home team final number of goals
          type: integer
          format: int32
        chip:
          description: The chip that the user played
          $ref: '#/components/schemas/chip'
        awayScore:
          description: The away team final number of goals
          type: integer
          format: int32
        matchId:
          description: The matchId which is being predicted
          type: string
        predictionId:
          description: Unique predictionId
          type: string
        userId:
          description: The user who made the prediction
          type: string
        toGoThrough:
          description: For knockout games, the team the user backed to go through
          $ref: '#/components/schemas/toGoThrough'
    match:
      type: object
      required:
        - homeTeam
        - homeTeamFlagCode
        - awayTeam
        - awayTeamFlagCode
        - matchId
        - venue
        - datetime
        - matchDay
        - round
        - state
      properties:
        homeTeam:
          description: Home team
          type: string
        homeTeamFlagCode:
          description: Home team flag code
          type: string
        homeTeamRanking:
          description: Home team ranking
          type: integer
          format: int32
        awayTeam:
          description: Away team
          type: string
        awayTeamFlagCode:
          description: Away team flag code
          type: string
        awayTeamRanking:
          description: Away team ranking
          type: integer
          format: int32
        homeScore:
          description: The home team final number of goals
          type: integer
          format: int32
        awayScore:
          description: The away team final number of goals
          type: integer
          format: int32
        matchId:
          description: Unique matchId
          type: string
        venue:
          description: Venue of the match
          type: string
        datetime:
          description: datetime of kickoff
          type: string
          format: date-time
        matchDay:
          description: Match day of the game
          type: integer
          format: int32
        round:
          description: Round of match
          type: string
          enum:
            - GROUP_STAGE
            - ROUND_OF_THIRTY_TWO
            - ROUND_OF_SIXTEEN
            - QUARTER_FINAL
            - SEMI_FINAL
            - THIRD_PLACE_PLAYOFF
            - FINAL
        state:
          description: State of the match
          type: string
          enum:
            - LIVE
            - UPCOMING
            - COMPLETED
        prediction:
          $ref: '#/components/schemas/prediction'
        predictionDistribution:
          $ref: '#/components/schemas/predictionDistribution'

    predictionDistribution:
      description: Counts of predictions by outcome (home/draw/away). Populated once a match is no longer UPCOMING.
      type: object
      required:
        - home
        - draw
        - away
      properties:
        home:
          type: integer
          format: int32
        draw:
          type: integer
          format: int32
        away:
          type: integer
          format: int32

    league:
      type: object
      required:
        - leagueId
        - name
        - kind
        - users
      properties:
        leagueId:
          description: Unique league Id
          type: string
        name:
          description: League name
          type: string
        kind:
          description: Whether the league is auto-managed by the system or user-created.
          type: string
          enum:
            - GLOBAL
            - COUNTRY
            - USER
        users:
          description: List of users in the league
          type: array
          items:
            $ref: '#/components/schemas/user'
        yourPosition:
          description: Position of the requesting user within this league. Omitted when not relevant (e.g. unauthenticated requests).
          type: integer
          format: int32
          minimum: 1
    team:
      type: object
      required:
        - teamId
        - teamName
        - flagCode
      properties:
        teamId:
          description: Team Id
          type: string
        teamName:
          description: Team name
          type: string
        flagCode:
          description: Team flag uri
          type: string
        group:
          description: Group letter (A-L) the team belongs to in the group stage
          type: string
    groupStandingRow:
      type: object
      required:
        - position
        - teamId
        - teamName
        - flagCode
        - group
        - played
        - won
        - drawn
        - lost
        - goalsFor
        - goalsAgainst
        - goalDifference
        - points
      properties:
        position:
          description: Position within the group (1-4) or, for the third-placed table, the overall third-placed ranking
          type: integer
          format: int32
        teamId:
          type: string
        teamName:
          type: string
        flagCode:
          type: string
        group:
          description: Group letter (A-L)
          type: string
        played:
          type: integer
          format: int32
        won:
          type: integer
          format: int32
        drawn:
          type: integer
          format: int32
        lost:
          type: integer
          format: int32
        goalsFor:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalDifference:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
    groupStanding:
      type: object
      required:
        - group
        - standings
      properties:
        group:
          description: Group letter (A-L)
          type: string
        standings:
          type: array
          items:
            $ref: '#/components/schemas/groupStandingRow'
    standings:
      type: object
      required:
        - groups
        - thirdPlaced
      properties:
        groups:
          description: Standings for each of the 12 groups, ordered A-L
          type: array
          items:
            $ref: '#/components/schemas/groupStanding'
        thirdPlaced:
          description: Ranking of the third-placed team from every group, as they stand
          type: array
          items:
            $ref: '#/components/schemas/groupStandingRow'
    leaderboard:
      type: array
      items:
        type: object
        required:
          - position
          - movement
          - user
        properties:
          position:
            type: integer
            format: int32
            minimum: 1
          user:
            $ref: '#/components/schemas/user'
          movement:
            type: string
            enum:
              - IMPROVED
              - WORSENED
              - UNCHANGED
    countryLeaderboard:
      description: Ranking of countries against one another. Each country's score is the sum, across every match, of the average points scored by that country's supporters who predicted that match.
      type: array
      items:
        type: object
        required:
          - position
          - movement
          - teamId
          - teamName
          - leagueId
          - flagCode
          - score
          - predictedMatches
          - predictorCount
        properties:
          position:
            type: integer
            format: int32
            minimum: 1
          teamId:
            description: Team Id of the country
            type: string
          teamName:
            description: Country (team) name
            type: string
          leagueId:
            description: Id of this country's league
            type: string
          flagCode:
            description: Country flag uri
            type: string
          score:
            description: Sum of per-match average points for this country's supporters
            type: number
            format: double
          predictedMatches:
            description: Number of distinct matches this country's supporters have scored predictions for
            type: integer
            format: int32
          predictorCount:
            description: Number of supporters of this country who have at least one scored prediction
            type: integer
            format: int32
          movement:
            type: string
            enum:
              - IMPROVED
              - WORSENED
              - UNCHANGED
    user:
      type: object
      required:
        - firstName
        - familyName
        - userId
        - doublePointsChipsRemaining
        - oneOutChipsRemaining
        - crowdChipsRemaining
        - fixedPoints
        - livePoints
      properties:
        firstName:
          type: string
        familyName:
          type: string
        userId:
          type: string
        doublePointsChipsRemaining:
          type: integer
        oneOutChipsRemaining:
          type: integer
        crowdChipsRemaining:
          type: integer
        fixedPoints:
          type: integer
        livePoints:
          type: integer
        supportedTeamName:
          type: string
        supportedTeamFlagCode:
          type: string
    toGoThrough:
      description: For knockout games which team will go through
      type: string
      enum:
        - HOME
        - AWAY
    chip:
      description: A chip to modify the prediction
      type: string
      enum:
        - NONE
        - DOUBLE_POINTS
        - ONE_GOAL_OUT
        - CROWD
    predictionWithUser:
      type: object
      required:
        - prediction
        - user
      properties:
        prediction:
          $ref: '#/components/schemas/prediction'
        user:
          $ref: '#/components/schemas/user'
    trackingEvent:
      type: object
      required:
        - event
        - fromSignup
      properties:
        event:
          type: string
          enum:
            - JoinPagePresented
            - JoinClicked
            - MaybeLaterClicked
        fromSignup:
          type: boolean
    bracketMatch:
      description: A single knockout match in the Knockout Cup side-game, with the user's backed side and the points it earned.
      type: object
      required:
        - matchId
        - round
        - homeTeam
        - homeTeamFlagCode
        - awayTeam
        - awayTeamFlagCode
        - kickoff
        - state
        - basePoints
        - bonusPoints
      properties:
        matchId:
          description: Unique matchId
          type: string
        round:
          description: Knockout round of the match
          type: string
          enum:
            - ROUND_OF_THIRTY_TWO
            - ROUND_OF_SIXTEEN
            - QUARTER_FINAL
            - SEMI_FINAL
            - FINAL
        homeTeam:
          type: string
        homeTeamFlagCode:
          type: string
        awayTeam:
          type: string
        awayTeamFlagCode:
          type: string
        kickoff:
          description: datetime of kickoff
          type: string
          format: date-time
        state:
          type: string
          enum:
            - LIVE
            - UPCOMING
            - COMPLETED
        userPick:
          description: The side the user backed to go through, if they predicted this match
          $ref: '#/components/schemas/toGoThrough'
        actualGoThrough:
          description: The side that actually went through, for completed matches
          $ref: '#/components/schemas/toGoThrough'
        correct:
          description: Whether the user's pick matched the side that went through (completed matches only)
          type: boolean
        basePoints:
          description: Base points earned for this match (0 unless correct)
          type: integer
          format: int32
        bonusPoints:
          description: Streak bonus points earned for this match (0 unless correct)
          type: integer
          format: int32
        bracketPosition:
          description: >-
            The match's slot in the bracket. Seeded for the Round of 32 as 1..16
            in top-to-bottom bracket order; consecutive pairs (1&2, 3&4, ...) feed
            each Round of 16 tie, so the frontend can order the round and derive
            the rest of the tree. Null until a round's slots are seeded.
          type: integer
          format: int32
    bracket:
      description: The requesting user's Knockout Cup run and running score.
      type: object
      required:
        - matches
        - totalPoints
        - currentStreak
      properties:
        matches:
          description: The user's knockout matches in kickoff order
          type: array
          items:
            $ref: '#/components/schemas/bracketMatch'
        totalPoints:
          type: integer
          format: int32
        currentStreak:
          description: Current run of consecutive correct picks (kickoff order)
          type: integer
          format: int32
    bracketLeaderboardRow:
      description: One member's standing in a league's Knockout Cup.
      type: object
      required:
        - position
        - userId
        - firstName
        - familyName
        - totalPoints
        - isCupHolder
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
        userId:
          type: string
        firstName:
          type: string
        familyName:
          type: string
        totalPoints:
          type: integer
          format: int32
        isCupHolder:
          description: Whether this member currently holds the league's Knockout Cup
          type: boolean
security:
  - CognitoAuthorizer: []
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: |
        {
            "message": "$context.error.validationErrorString"
        }
x-amazon-apigateway-request-validator: DefaultValidator
x-amazon-apigateway-request-validators:
  DefaultValidator:
    validateRequestParameters: true
    validateRequestBody: true
paths:
  /standings:
    get:
      tags:
        - standings
      operationId: getStandings
      description: Group stage standings (as they stand, including live scores) plus the third-placed team ranking
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standings'
  /team:
    get:
      tags:
        - team
      operationId: getTeams
      description: List all teams
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/team'
    post:
      tags:
        - team
      operationId: createTeam
      description: Create a team
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamName:
                  type: string
                flagCode:
                  type: string
              required:
                - teamName
                - flagCode
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  teamId:
                    type: string
  /team/{teamId}:
    get:
      tags:
        - team
      operationId: getTeam
      description: Get a team by Id
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/team'
  /team/name/{teamName}:
    get:
      tags:
        - team
      operationId: getTeamByName
      description: Get a team by Name
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: teamName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/team'

  /prediction/{matchId}:
    get:
      tags:
        - prediction
      operationId: getPrediction
      description: Get a prediction for a match
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/prediction'


  /prediction:
    post:
      tags:
        - prediction
      operationId: createPrediction
      description: Create a prediction
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homeScore:
                  description: The home team final number of goals
                  type: integer
                  format: int32
                awayScore:
                  description: The away team final number of goals
                  type: integer
                  format: int32
                matchId:
                  description: The matchId which is being predicted
                  type: string
                chip:
                  description: The chip that the user played
                  $ref: '#/components/schemas/chip'
                toGoThrough:
                  $ref: '#/components/schemas/toGoThrough'
              required:
                - homeScore
                - awayScore
                - matchId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - predictionId
                  - doublePointsChipsRemaining
                  - oneOutChipsRemaining
                  - crowdChipsRemaining
                properties:
                  predictionId:
                    type: string
                  doublePointsChipsRemaining:
                    type: integer
                    format: int32
                  oneOutChipsRemaining:
                    type: integer
                    format: int32
                  crowdChipsRemaining:
                    type: integer
                    format: int32
  /match/data/{matchId}:
    get:
      tags:
        - match
      operationId: getMatch
      description: Get a match
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/match'

  /match:
    post:
      tags:
        - match
      operationId: createMatch
      description: Create a match
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homeTeamId:
                  description: Home team ID
                  type: string
                awayTeamId:
                  description: Away team ID
                  type: string
                datetime:
                  description: datetime of kickoff
                  type: string
                  format: date-time
                venue:
                  description: Venue of the match
                  type: string
                matchDay:
                  description: Match day
                  type: integer
                matchRound:
                  description: Round of match
                  type: string
                  enum:
                    - GROUP_STAGE
                    - ROUND_OF_THIRTY_TWO
                    - ROUND_OF_SIXTEEN
                    - QUARTER_FINAL
                    - SEMI_FINAL
                    - THIRD_PLACE_PLAYOFF
                    - FINAL
              required:
                - homeTeamId
                - awayTeamId
                - datetime
                - venue
                - matchDay
                - matchRound
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchId:
                    type: string

  /match/list:
    get:
      tags:
        - match
      operationId: listMatches
      description: List matches
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: query
          name: filterType
          schema:
            type: string
            enum: [live, upcoming, completed]
        - in: query
          name: userId
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/match'
  /match/{matchId}/predictions:
    get:
      tags:
        - match
      operationId: getMatchPredictions
      description: Get match predictions
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
        - in: query
          name: leagueId
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/predictionWithUser'
  /match/{matchId}/score:
    post:
      tags:
        - match
      operationId: setMatchScore
      description: Update match score
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homeScore:
                  description: The home team final number of goals
                  type: integer
                  format: int32
                awayScore:
                  description: The away team final number of goals
                  type: integer
                  format: int32
              required:
                - homeScore
                - awayScore
      responses:
        '200':
          description: Successful response

  /match/{matchId}/complete:
    post:
      tags:
        - match
      operationId: completeMatch
      description: Mark match as completed
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - homeScore
                - awayScore
              properties:
                homeScore:
                  description: The home team final number of goals
                  type: integer
                  format: int32
                awayScore:
                  description: The away team final number of goals
                  type: integer
                  format: int32
                toGoThrough:
                  $ref: '#/components/schemas/toGoThrough'


      responses:
        '200':
          description: Successful response

  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      description: Login
      security: []
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${apiAuthHandlerArn}/invocations"
        credentials: "${apiGatewayRoleArn}"
        payloadFormatVersion: "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
